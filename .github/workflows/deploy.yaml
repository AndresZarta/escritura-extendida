name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch's name
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:
  # Also trigger after CI completes successfully
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [ main ]

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify-version:
    name: Verificar versión antes de deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Get current version
        id: get_version
        run: |
          VERSION=$(node -p "require('./site-version.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Versión actual: $VERSION"

      - name: Get previous version
        id: prev_version
        run: |
          git checkout HEAD~1 -- site-version.json 2>/dev/null || echo '{"version":"0.0.0"}' > site-version.json
          PREV_VERSION=$(node -p "require('./site-version.json').version")
          echo "version=$PREV_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Versión anterior: $PREV_VERSION"
          git checkout HEAD -- site-version.json

      - name: Verify version was bumped
        run: |
          CURRENT="${{ steps.get_version.outputs.version }}"
          PREVIOUS="${{ steps.prev_version.outputs.version }}"
          
          if [ "$CURRENT" = "$PREVIOUS" ]; then
            echo "❌ DEPLOY BLOQUEADO: La versión no ha cambiado desde el último deploy"
            echo "   Versión anterior: $PREVIOUS"
            echo "   Versión actual:   $CURRENT"
            echo ""
            echo "⚠️  Esto indica que se hizo merge sin incrementar la versión."
            echo "   El deploy ha sido bloqueado para prevenir releases sin versionado."
            exit 1
          fi
          
          echo "✅ Versión incrementada: $PREVIOUS → $CURRENT"

  build:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v5
      - name: Install, build, and upload your site
        uses: withastro/action@v5
        env:
          GITHUB_SHA: ${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Announce deployment
        run: |
          echo "🚀 Deploy exitoso de versión ${{ needs.verify-version.outputs.version }}"
          echo "📍 URL: ${{ steps.deployment.outputs.page_url }}"